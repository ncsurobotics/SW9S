[package]
authors = ["AquaPack Robotics <aquapack@aquapackrobotics.org>"]
edition = "2021"
# If you change the name here, you must also do it in flake.nix (and run `cargo generate-lockfile` afterwards)
name = "sw9s"
description = "High level software for the SeaWolf 9 AUV"
version = "0.1.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "4.3.14", features = ["derive"] }
color-eyre = "0.6.5"
console-subscriber = "0.5.0"
rerun = "0.35.0"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["full", "tracing"] }
tokio-util = "0.7.19"
toml = "1.1.4"
tracing = "0.1.44"
tracing-error = "0.2.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
auv_control_board = { git = "https://github.com/ncsurobotics/AUVControlBoard.git" }
